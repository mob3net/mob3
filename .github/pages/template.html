<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<title>{{TITLE}}</title>
<script>
try {
  var saved = localStorage.getItem("mob3-docs-theme");
  if (saved === "light" || saved === "dark") {
    document.documentElement.setAttribute("data-theme", saved);
  }
} catch (e) {}
</script>
<style>
  :root {
    --primary: #34b891;
    --primary-dark: #23876a;
    --primary-light: #e9f7f2;
    --fg: #1d1d1f;
    --muted: #6b6b70;
    --line: #e3e3e6;
    --bg: #f5f5f5;
    --surface: #fff;
    --code-bg: #f7f7f8;
    --max-width: 72rem;
    --article: 60rem;
    --sidebar: 17rem;
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--fg);
    font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--primary-dark); }
  a:hover { color: var(--primary); }
  strong { font-weight: 700; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  .skip {
    position: absolute;
    left: -9999px;
    top: 0;
    padding: .6rem 1rem;
    background: var(--primary);
    color: #fff;
    z-index: 30;
  }
  .skip:focus { left: 0; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: .6rem 1.25rem;
  }
  .brand {
    display: flex;
    align-items: center;
    color: var(--fg);
    text-decoration: none;
    white-space: nowrap;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: .01em;
  }
  .brand:hover { color: var(--primary-dark); }
  .tagline {
    color: var(--muted);
    font-size: .88rem;
    white-space: nowrap;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .theme-toggle, .nav-toggle {
    display: grid;
    place-items: center;
    min-height: 44px;
    padding: 0 .8rem;
    font: inherit;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
  }
  .theme-toggle { width: 44px; padding: 0; }
  .theme-toggle:hover, .nav-toggle:hover {
    color: var(--fg);
    border-color: var(--primary);
  }
  .theme-toggle svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .theme-toggle .icon-sun, .theme-toggle .icon-moon { display: none; }
  :root:not([data-theme="dark"]) .theme-toggle .icon-moon { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  .nav-toggle { display: none; font-size: .9rem; }

  .docs-layout {
    display: flex;
    align-items: flex-start;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  #sidebar {
    position: sticky;
    top: 3.6rem;
    flex: 0 0 var(--sidebar);
    width: var(--sidebar);
    max-height: calc(100vh - 3.6rem);
    overflow-y: auto;
    padding: 1.5rem 1rem 3rem;
    border-right: 1px solid var(--line);
  }
  #sidebar h2 {
    margin: 0 0 .5rem;
    padding: 0 .6rem;
    border: 0;
    font-size: .78rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #sidebar ul { margin: 0; padding: 0; list-style: none; }
  #sidebar a {
    display: block;
    padding: .35rem .6rem;
    border-radius: 6px;
    color: var(--muted);
    font-size: .92rem;
    text-decoration: none;
  }
  #sidebar a:hover { background: var(--bg); color: var(--fg); }
  #sidebar a.active { color: var(--primary-dark); background: var(--primary-light); }

  .content {
    flex: 1 1 auto;
    min-width: 0;
    max-width: var(--article);
    padding: 2rem 2.5rem 4rem;
  }
  body:not(.docs-page) .content {
    margin: 0 auto;
  }

  h1 { margin: 0 0 1.2rem; font-size: 2rem; line-height: 1.25; }
  h2 {
    margin: 2.4rem 0 .8rem;
    padding-bottom: .3rem;
    font-size: 1.35rem;
    border-bottom: 1px solid var(--line);
  }
  h3 { margin: 1.8rem 0 .5rem; font-size: 1.1rem; }
  h4 { margin: 1.4rem 0 .4rem; font-size: 1rem; }
  p, ul, ol, table, pre, blockquote { margin: 0 0 1rem; }
  li > ul, li > ol { margin: .2rem 0 .4rem; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2.2rem 0; }
  blockquote {
    margin: 1.2rem 0;
    padding: .2rem 1rem;
    border-left: 3px solid var(--primary);
    background: var(--code-bg);
    color: var(--fg);
  }
  blockquote > p:last-child { margin-bottom: 0; }
  img { max-width: 100%; height: auto; }

  .content div[align="center"] { text-align: center; margin-bottom: 1rem; }
  .content div[align="center"] img {
    display: inline-block;
    width: 32%;
    margin: 0;
    vertical-align: top;
  }

  code {
    padding: .1em .35em;
    background: var(--code-bg);
    border-radius: 4px;
    font: .9em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  pre {
    padding: 1rem 1.1rem;
    overflow-x: auto;
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: .88rem;
    line-height: 1.55;
  }
  pre code { padding: 0; background: none; font-size: inherit; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .94rem;
    display: block;
    overflow-x: auto;
  }
  th, td {
    padding: .5rem .75rem;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--line);
  }
  th { font-weight: 600; border-bottom-width: 2px; }
  tbody tr:hover { background: var(--bg); }

  .toc {
    margin: 3rem 0 0;
    padding: 1rem 1.2rem;
    background: var(--code-bg);
    border-radius: var(--radius);
    font-size: .92rem;
  }
  .toc-title { margin: 0 0 .4rem; font-weight: 600; }
  .toc ul { margin: 0; padding-left: 1.1rem; }
  .toc a { color: var(--muted); text-decoration: none; }
  .toc a:hover { color: var(--primary-dark); text-decoration: underline; }

  .site-footer {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .9rem;
  }
  .site-footer p { margin: 0; }

  @media (max-width: 860px) {
    .tagline { display: none; }
    .nav-toggle { display: block; }
    body:not(.docs-page) .nav-toggle { display: none; }
    .docs-layout { display: block; }
    #sidebar {
      position: static;
      display: none;
      width: auto;
      max-height: none;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      padding: .5rem .75rem 1rem;
    }
    body.nav-open #sidebar { display: block; }
    .content { max-width: none; padding: 1.5rem 1.1rem 3rem; }
    h1 { font-size: 1.6rem; }
    .header-inner { gap: .6rem; padding: .5rem .9rem; }
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #4fd1a9;
      --primary-dark: #34b891;
      --primary-light: #14332b;
      --fg: #e6e6e8;
      --muted: #9a9aa0;
      --line: #2c2c30;
      --bg: #1a1a1c;
      --surface: #131315;
      --code-bg: #1d1d20;
    }
  }
  :root[data-theme="dark"] {
    --primary: #4fd1a9;
    --primary-dark: #34b891;
    --primary-light: #14332b;
    --fg: #e6e6e8;
    --muted: #9a9aa0;
    --line: #2c2c30;
    --bg: #1a1a1c;
    --surface: #131315;
    --code-bg: #1d1d20;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
    :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: block; }
  }
</style>
</head>
<body class="{{BODY_CLASS}}">
<a class="skip" href="#content">Skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ROOT}}/index.html">MOB³</a>
    <span class="tagline">Documentation</span>
    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Switch theme" title="Switch between light and dark">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.7 8.7 0 1 0 11.1 11.1z"></path>
        </svg>
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>
    </div>
  </div>
</header>
{{LAYOUT_START}}
{{SIDEBAR}}
<main class="content" id="content">
{{CONTENT}}
{{TOC}}
</main>
{{LAYOUT_END}}
<footer class="site-footer">
  <p>Copyright (c) 2026 Milos Stojanovic. Licensed under AGPL-3.0-only.</p>
</footer>
<script>
(function () {
  var theme = document.querySelector(".theme-toggle");
  if (theme) {
    theme.addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.getAttribute("data-theme");
      if (!current) {
        current = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark" : "light";
      }
      var next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("mob3-docs-theme", next); } catch (e) {}
    });
  }
  var nav = document.querySelector(".nav-toggle");
  if (nav) {
    nav.addEventListener("click", function () {
      var open = document.body.classList.toggle("nav-open");
      nav.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }
})();
</script>
</body>
</html>
