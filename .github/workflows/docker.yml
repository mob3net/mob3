name: Docker image

on:
  workflow_run:
    workflows: ["Release binaries"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish container image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="$HEAD_BRANCH"
          if [[ ! "$version" =~ ^v[0-9] ]]; then
            version="$(git tag --points-at HEAD | grep -E '^v[0-9]' | sort -V | tail -n1 || true)"
          fi
          if [[ -z "$version" ]]; then
            echo "No release tag found for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The builder cross-compiles for every target; QEMU is needed for the
      # Alpine runtime's apk and adduser steps on non-amd64 platforms.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mob3net/mob3
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
