name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - name: Check contribution statement
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          needle="I have read and agree to the MOB³ Contributor License Agreement."
          if ! grep -Fq -- "$needle" <<<"${PR_BODY:-}"; then
            echo "::error::Add the CLA statement from CONTRIBUTING.md to the pull request description." >&2
            exit 1
          fi
          echo "CLA statement found."
