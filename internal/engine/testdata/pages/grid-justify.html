<!DOCTYPE html>
<html><head><style>
body { margin: 0; }
.stack { display: grid; justify-items: center; }
.card { width: 120px; border: 1px solid #999999; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; justify-items: center; }
.cell { width: 96px; border: 1px solid #999999; }
.end { justify-self: end; }
</style></head><body>
<div class="stack"><div class="card">centered card</div></div>
<div class="row"><div class="cell">left cell</div><div class="cell end">right cell</div></div>
</body></html>
