<!doctype html>
<html><head><style>
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:monospace}
.row{display:flex;width:640px}
.col{padding:0 8px}
.left{width:50%}
.right{width:25%;margin-left:25%}
</style></head>
<body>
<div class="row">
<div class="col left">Left column text wraps inside half the row and stops before the gutter.</div>
<div class="col right">Right</div>
</div>
</body></html>
