<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; padding: 8px; font-size: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.card { display: inline; width: 320px; position: relative; color: #112233; text-decoration: none; }
.inner { background: #eeeeee; padding: 4px; }
.card h3 { margin: 0; font-size: 16px; }
.card p { margin: 2px 0 0 0; }
</style>
</head>
<body>
<div class="row">
  <a class="card" href="#"><div class="inner"><h3>Artemis</h3><p>Moon base</p></div></a>
  <a class="card" href="#"><div class="inner"><h3>Perseverance</h3><p>Mars rover</p></div></a>
  <a class="card" href="#"><div class="inner"><h3>Hubble</h3><p>Space telescope</p></div></a>
  <a class="card" href="#"><div class="inner"><h3>Webb</h3><p>Infrared observatory</p></div></a>
</div>
<p>Text after the cards stays below them.</p>
</body>
</html>
