<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
ul, ol { margin: 0 0 8px 0; padding-left: 24px; }
li { margin-bottom: 2px; }
dl { margin: 0; }
dt { font-weight: 600; }
dd { margin: 0 0 4px 24px; }
.roman { list-style-type: upper-roman; }
.alpha { list-style-type: lower-alpha; }
</style>
</head>
<body>
<h2>Lists</h2>
<ul>
  <li>First item</li>
  <li>Second item
    <ul>
      <li>Nested one</li>
      <li>Nested two</li>
    </ul>
  </li>
</ul>
<ol>
  <li>Step one</li>
  <li>Step two
    <ol class="alpha">
      <li>Sub step</li>
    </ol>
  </li>
</ol>
<ol class="roman">
  <li>Roman one</li>
  <li>Roman two</li>
</ol>
<dl>
  <dt>Term</dt>
  <dd>Definition text for the term.</dd>
  <dt>Another term</dt>
  <dd>Second definition.</dd>
</dl>
</body>
</html>
