<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Flex inline SVG</title>
<style>
body { margin: 0; font: 16px/1.4 sans-serif; }
.top { display: flex; align-items: center; justify-content: center; padding: 8px; background: #eef2f7; }
.logo { display: flex; justify-content: center; }
.logo svg { height: 32px; width: auto; }
nav { display: flex; gap: 8px; padding: 4px 8px; }
nav a { color: #1f4f9f; }
</style></head>
<body>
<div class="top"><div class="logo"><svg viewBox="0 0 32 32" role="img"><title>Acme logo</title><circle cx="16" cy="16" r="14"/></svg></div></div>
<nav><a href="#a">Home</a><a href="#b">Docs</a><a href="#c">About</a></nav>
<p>Text after the flex row stays in flow.</p>
<p><svg aria-label="status icon" viewBox="0 0 8 8"><path d="M0 0h8v8z"/></svg> inline icon after text</p>
</body></html>
