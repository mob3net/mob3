<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
.layout { position: relative; height: 80px; border: 1px solid #ccc; padding: 4px; }
.badge { position: absolute; top: 4px; right: 4px; padding: 2px; background: #eee; }
.offset { position: relative; left: 16px; top: 4px; padding: 2px; background: #eee; }
.fixed { position: fixed; top: 0; right: 0; padding: 2px; background: #eee; }
.overlay-card { position: relative; height: 40px; border: 1px solid #ccc; padding: 4px; }
.overlay-card a.stretched { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
</style>
</head>
<body>
<div class="fixed">Fixed corner</div>
<div class="layout">Box text <span class="badge">Badge</span> <span class="offset">Shifted run</span></div>
<div class="overlay-card"><p>Card title</p><a class="stretched" href="/card">Open card</a></div>
<p>After the positioned boxes.</p>
</body>
</html>
