<!DOCTYPE html>
<html><head><style>
body { margin: 0; }
.header { position: sticky; top: 0; background: #dddddd; padding: 2px 0; }
.section { padding: 4px 0; }
p { margin: 0 0 6px; }
</style></head><body>
<div class="header">Sticky header</div>
<div class="section">
<p>First paragraph of the section.</p>
<p>Second paragraph stays in normal flow.</p>
<p>Third paragraph closes the section.</p>
</div>
</body></html>
