<!doctype html>
<html>

<style>
body { font-size: 16px; margin: 0; padding: 8px; }

.cards { position: absolute; right: 0; top: 8px; }
.card { position: absolute; width: 80px; height: 96px; box-sizing: border-box; padding: 4px; background: #eee; }
.card.one { right: 0; top: 0; }
.card.two { right: 74px; top: 12px; }
</style>
</head>
<body>
<div class="holder">
  <div class="cards">
    <a class="card one" href="/one">Newspaper issue</a>
    <a class="card two" href="/two">Archive</a>
  </div>
</div>
<p>Content after the card holder.</p>
</body>
</html>
