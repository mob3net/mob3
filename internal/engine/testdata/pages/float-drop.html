<!doctype html>
<html>
<head>
<title>Float drop</title>
<style>
body { margin: 0; }
.wrap { width: 160px; }
.wrap div { float: left; }
.a { width: 50%; height: 48px; background: #eeeeee; }
.b { width: 50%; height: 32px; background: #dddddd; }
.c { width: 25%; height: 32px; background: #cccccc; }
.d { width: 25%; height: 32px; background: #bbbbbb; }
</style>
</head>
<body>
<div class="wrap">
  <div class="a">A</div><div class="b">B</div><div class="c">C</div><div class="d">D</div>
</div>
</body>
</html>
