<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; padding: 4px; font-family: monospace; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 20px; margin-bottom: 8px; }
.optout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 20px; }
.grid div, .optout div { border: 1px solid #cccccc; padding: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div>hello</div><div>world</div><div>alpha</div><div>beta</div>
</div>
<div class="optout">
  <div>hello</div><div>world</div><div>alpha</div><div>beta</div>
</div>
</body>
</html>
