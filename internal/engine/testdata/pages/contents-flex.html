<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; font-size: 16px; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #eeeeee; }
.left { display: flex; flex: none; }
.links { display: contents; }
.links a { margin-right: 12px; color: #003366; text-decoration: none; }
.right { flex: none; color: #333333; }
</style>
</head>
<body>
<div class="bar">
  <div class="left"><div class="links">
    <a href="#">Home</a><a href="#">World</a><a href="#">Politics</a><a href="#">Business</a>
  </div></div>
  <div class="right">Sign in</div>
</div>
<p>Content below the bar stays clear of the links.</p>
</body>
</html>
