<!doctype html>
<html>
<head>
<title>Percentage heights</title>
<style>
body { margin: 0; }
.fixed { height: 64px; background: #eeeeee; }
.fill { height: 100%; background: #dddddd; }
.half { height: calc(50% - 8px); background: #cccccc; }
</style>
</head>
<body>
<div class="fixed"><div class="fill">full height</div></div>
<p>after fixed</p>
<div class="fixed"><div class="half">half height</div><p>after half</p></div>
<div class="auto"><div class="fill">auto parent</div><p>after auto</p></div>
</body>
</html>
