<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #999; padding: 4px; text-align: left; vertical-align: top; }
td.num { width: 64px; text-align: right; }
</style>
</head>
<body>
<table>
<tr><th>Name</th><th>Status</th><th class="num">Count</th></tr>
<tr><td>Alpha</td><td>Ready</td><td class="num">12</td></tr>
<tr><td>Beta with a longer label</td><td>Waiting</td><td class="num">3</td></tr>
<tr><td colspan="2">Total rows</td><td class="num">2</td></tr>
</table>
<p>Caption after the table.</p>
</body>
</html>
