<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
.layout { display: flex; flex-flow: row wrap; }
.column { display: inline-block; width: 100%; }
.panel { width: 100%; height: 3rem; background: #ddd; }
.deck { display: flex; flex-flow: row wrap; margin: 0; padding: 0; list-style: none; }
.card { width: calc(100% / 3); }
.card h3 { margin: 4px 0 0 0; }
.card p { margin: 0; }
</style>
</head>
<body>
<div class="layout">
  <div class="column">
    <h2>Section heading</h2>
    <p>Lead text stays above the cards and fills the whole column instead of running into them.</p>
    <ul class="deck">
      <li class="card"><div class="panel"></div><h3>First card</h3><p>Body of the first card.</p></li>
      <li class="card"><div class="panel"></div><h3>Second card</h3><p>Body of the second card.</p></li>
      <li class="card"><div class="panel"></div><h3>Third card</h3><p>Body of the third card.</p></li>
    </ul>
  </div>
</div>
</body>
</html>
