<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Escaped utility selectors</title>
<style>
body { margin: 0; font: 16px/1.4 sans-serif; }
.panel { padding: 4px; }
.panel.before\:content-\[\'\'\]::before { content: ''; display: block; height: 0; }
.panel.before\:content-\[\'\'\] { background: #fde68a; }
.grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px; }
.cell { background: #eef2f7; padding: 4px; }
</style></head>
<body>
<div class="panel before:content-['']">Escaped utility panel</div>
<div class="grid">
  <div class="cell">Left</div>
  <div class="cell">Right side text</div>
</div>
<p>Text after the grid keeps its place.</p>
</body></html>
