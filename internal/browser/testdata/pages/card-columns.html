<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.card { width: 180px; padding: 8px; border: 1px solid #ccc; }
.card h2 { font-size: 16px; margin: 0 0 4px 0; }
.card p { margin: 0; }
.meta { color: #777; }
</style>
</head>
<body>
<div class="row">
  <div class="card"><h2><a href="/a">Long headline that wraps inside a narrow card</a></h2><p class="meta">News</p></div>
  <div class="card"><h2><a href="/b">Short headline</a></h2><p class="meta">Sport</p></div>
  <div class="card"><h2><a href="/c">Another headline with several words</a></h2><p class="meta">Culture</p></div>
</div>
<p>Text after the card row.</p>
</body>
</html>
