<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); }
ol.roman { list-style-type: upper-roman; }
ol.alpha { list-style-type: lower-alpha; }
ul.square { list-style-type: square; }
blockquote { border-left: 4px solid #ccc; padding-left: 8px; margin: 8px 0; }
</style>
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<h2>Lists</h2>
<ol class="roman"><li>First item</li><li>Second item</li></ol>
<ol class="alpha"><li>Alpha item</li><li>Beta item</li></ol>
<ul class="square"><li>Square item</li></ul>
<details><summary>Closed details</summary><p>Hidden paragraph</p></details>
<details open><summary>Open details</summary><p>Visible paragraph</p></details>
<blockquote>Quoted text with a decorative border.</blockquote>
</body>
</html>
