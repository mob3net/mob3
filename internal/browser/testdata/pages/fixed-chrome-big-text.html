<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; padding: 8px; }
.bar { position: fixed; top: 0; left: 0; right: 0; height: 24px; background: #222; color: #fff; padding: 4px 8px; }
.bar span { font-size: 12px; }
h1 { font-size: 32px; line-height: 32px; margin: 0 0 8px 0; }
p { font-size: 14px; line-height: 20px; margin: 0 0 8px 0; }
.spacer { height: 24px; }
</style>
</head>
<body>
<div class="bar"><span>Fixed notice bar</span></div>
<div class="spacer"></div>
<h1>Large heading</h1>
<p>Body text below the large heading. Its scaled letters must not overlap the fixed bar above.</p>
<h1>Second large heading</h1>
<p>Closing paragraph.</p>
</body>
</html>
