<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
.row { display: flex; flex-wrap: wrap; }
.sidebar { order: 0; width: 25%; box-sizing: border-box; padding: 0 16px; border-right: 1px solid #ccc; }
.sidebar h2 { font-size: 16px; margin: 0 0 4px 0; }
.sidebar ul { padding-left: 16px; margin: 0; }
.content { order: 1; width: 75%; box-sizing: border-box; padding: 0 16px; }
.content h1 { font-size: 24px; margin: 0 0 8px 0; }
@media (min-width: 960px) {
  .row { flex-wrap: nowrap; }
}
</style>
</head>
<body>
<div class="row">
  <div class="sidebar">
    <h2>Guide</h2>
    <ul>
      <li><a href="#intro">Introduction</a></li>
      <li><a href="#start">Quick start</a></li>
      <li><a href="#params">Parameters</a></li>
      <li><a href="#errors">Errors</a></li>
    </ul>
  </div>
  <div class="content">
    <h1>Documentation</h1>
    <p>Sidebar entries stay in their own column while the documentation text fills
    the remaining width without overlapping the navigation.</p>
    <p>A short second paragraph checks the gutter and wrapping at both widths.</p>
  </div>
</div>
</body>
</html>
