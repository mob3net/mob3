<!DOCTYPE html>
<html><head><style>
body { margin: 0; }
.frame { position: relative; height: 3; }
.card { position: absolute; top: 0; left: 0; background: #eeeeee; }
.high { z-index: 3; }
.mid { z-index: 2; }
.low { z-index: 1; }
</style></head><body>
<div class="frame">
<div class="card high">HIGH layer</div>
<div class="card mid">MID layer</div>
<div class="card low">LOW layer</div>
</div>
</body></html>
