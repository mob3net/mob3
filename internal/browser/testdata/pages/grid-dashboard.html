<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
.dash { display: grid; grid-template-columns: 1fr 2fr; column-gap: 8px; row-gap: 4px; }
.card { border: 1px solid #ccc; padding: 6px; }
.wide { grid-column: span 2; }
.area { display: grid; grid-template-areas: "head head" "side main"; grid-template-columns: 80px 1fr; gap: 4px; }
.area h2 { grid-area: head; margin: 0; }
.side { grid-area: side; background: #eee; padding: 4px; }
.main { grid-area: main; padding: 4px; }
</style>
</head>
<body>
<div class="dash">
  <div class="card">Left column text that wraps</div>
  <div class="card">Right column with more words to fill the wider track</div>
  <div class="card wide">Wide summary across both columns</div>
</div>
<div class="area">
  <h2>Area heading</h2>
  <div class="side">Side</div>
  <div class="main">Main content for the named area</div>
</div>
</body>
</html>
