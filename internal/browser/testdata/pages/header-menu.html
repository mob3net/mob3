<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
body { font-size: 16px; margin: 0; padding: 16px; }
header { display: flex; justify-content: space-between; line-height: 2; padding-bottom: 8px; }
header p { margin: 0; }
header ul { list-style: none; padding: 0; margin: 0; }
header li, header a { display: inline; }
header ul a:first-child { padding-left: 8px; }
main { max-width: 560px; }
</style>
</head>
<body>
<header>
  <p><a href="/"><b>Agency</b> <span>|</span></a></p>
  <ul>
    <li><a href="/products"><span>Products</span></a></li>
    <li><a href="/contact"><span>Contact</span></a></li>
  </ul>
</header>
<h1>Overview</h1>
<p>The header above keeps its logo and links on one row.</p>
<p>A second paragraph checks that the following content starts below the header.</p>
</body>
</html>
