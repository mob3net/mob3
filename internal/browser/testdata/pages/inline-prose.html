<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-size: 16px; margin: 0; padding: 8px; }
p { line-height: 1.5; }
code { padding: 3px; margin: 0 3px; border: 1px solid #aaa; background: #eee; font-size: 85%; }
.menu { list-style: none; padding: 0; margin: 0 0 8px 0; }
.menu li { display: inline; padding: 0 6px; background: #eee; }
</style>
</head>
<body>
<ul class="menu">
  <li><a href="/one">First</a></li>
  <li><a href="/two">Second</a></li>
  <li><a href="/three">Third</a></li>
</ul>
<p>Use <code>alpha/beta</code>, <code>gamma/delta</code> and <code>epsilon</code> together in one sentence that wraps across the terminal width.</p>
<p>Inline <b>bold</b>, <i>italic</i> and <a href="/link">linked</a> runs stay in the flow.</p>
</body>
</html>
